services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: partnershop-backend
    container_name: partnershop-backend

    env_file:
      - .env

    environment:
      - NODE_ENV=production

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - shared-services-network

networks:
  shared-services-network:
    external: true